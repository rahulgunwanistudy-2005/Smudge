name: Verify Smudge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.23'
      - run: npm ci
      - run: python -m pip install -r 'AI Assisted/lab/requirements.txt' -r 'AI Assisted/tests/requirements.txt'
      - run: npm run build:native && npm run build:wasm
      - run: npm run check && npm test
      - run: npm run build
      - run: npm run budget
      - run: python -m playwright install --with-deps chromium
      - run: python 'AI Assisted/tests/run_release.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            AI Assisted/lab/results/
            AI Assisted/docs/screenshots/
